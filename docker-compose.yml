name: tickstream

x-spark-env: &spark-env
  TICKSTREAM_CONFIG_FILE: /app/config/config.yaml
  TICKSTREAM_APP__LOG_LEVEL: ${TICKSTREAM_APP__LOG_LEVEL:-INFO}
  TICKSTREAM_SPARK__KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  TICKSTREAM_SPARK__TOPIC: trades
  TICKSTREAM_SPARK__CHECKPOINT_DIR: /opt/tickstream/checkpoints
  TICKSTREAM_SPARK__TRIGGER_INTERVAL: ${SPARK_TRIGGER_INTERVAL:-5 seconds}
  TICKSTREAM_SPARK__MAX_OFFSETS_PER_TRIGGER: ${MAX_OFFSETS_PER_TRIGGER:-5000}
  TICKSTREAM_TIMESCALE__HOST: timescaledb
  TICKSTREAM_DELTA__ENABLED: ${TICKSTREAM_DELTA__ENABLED:-true}
  TICKSTREAM_DELTA__BASE_PATH: /opt/tickstream/delta

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: tickstream-kafka
    hostname: kafka
    ports:
      - "${KAFKA_HOST_PORT:-29092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks: [tickstream]

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: tickstream-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create_topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC: trades
      KAFKA_DLQ_TOPIC: trades_dlq
      KAFKA_PARTITIONS: 3
    volumes:
      - ./scripts:/scripts:ro
    restart: "no"
    networks: [tickstream]

  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: tickstream-timescaledb
    ports:
      - "${TIMESCALE_HOST_PORT:-55432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tickstream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tickstream}
      POSTGRES_DB: ${POSTGRES_DB:-tickstream}
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tickstream} -d ${POSTGRES_DB:-tickstream}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [tickstream]

  grafana:
    image: grafana/grafana:11.4.0
    container_name: tickstream-grafana
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-tickstream}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [tickstream]

  producer:
    build:
      context: .
      dockerfile: docker/producer/Dockerfile
    container_name: tickstream-producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      TICKSTREAM_CONFIG_FILE: /app/config/config.yaml
      TICKSTREAM_KAFKA__BOOTSTRAP_SERVERS: kafka:29092
      TICKSTREAM_KAFKA__TOPIC: trades
      TICKSTREAM_PRODUCER__SOURCE: ${TICKSTREAM_PRODUCER__SOURCE:-coinbase}
      TICKSTREAM_APP__LOG_LEVEL: ${TICKSTREAM_APP__LOG_LEVEL:-INFO}
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
      - ./data:/app/data:ro
    restart: unless-stopped
    networks: [tickstream]

  spark:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    container_name: tickstream-spark
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
    environment:
      <<: *spark-env
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --driver-memory
      - 1g
      - --conf
      - spark.sql.shuffle.partitions=4
      - --conf
      - spark.sql.streaming.metricsEnabled=true
      - /app/src/streaming/main.py
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
      - ./src:/app/src:ro
      - spark-checkpoints:/opt/tickstream/checkpoints
      - delta-data:/opt/tickstream/delta
    ports:
      - "${SPARK_UI_PORT:-4040}:4040"
    restart: unless-stopped
    networks: [tickstream]

  # Phase 2 (opt-in): docker compose --profile web up -d
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: tickstream-api
    profiles: ["web"]
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      TICKSTREAM_CONFIG_FILE: /app/config/config.yaml
      TICKSTREAM_APP__LOG_LEVEL: ${TICKSTREAM_APP__LOG_LEVEL:-INFO}
      TICKSTREAM_TIMESCALE__HOST: timescaledb
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    restart: unless-stopped
    networks: [tickstream]

  web:
    build:
      context: ./src/web
      dockerfile: Dockerfile
    container_name: tickstream-web
    profiles: ["web"]
    depends_on:
      - api
    ports:
      - "${WEB_HOST_PORT:-8080}:80"
    restart: unless-stopped
    networks: [tickstream]

volumes:
  kafka-data:
  timescale-data:
  grafana-data:
  spark-checkpoints:
  delta-data:

networks:
  tickstream:
    driver: bridge
