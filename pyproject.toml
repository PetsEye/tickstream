[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tickstream"
version = "0.1.0"
description = "Real-time crypto market analytics on Apache Kafka + Spark Structured Streaming"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Erik Pecaj" }]
keywords = ["kafka", "spark", "pyspark", "structured-streaming", "crypto", "data-engineering"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "aiokafka>=0.11",
  "websockets>=13.0",
  "pyyaml>=6.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "asyncpg>=0.29",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "pyspark==4.0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/common", "src/producer", "src/streaming", "src/api"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "E402"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
explicit_package_bases = true
packages = ["common", "producer", "streaming", "api"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
